# Builds Linux and Windows release binaries and publishes them, plus
# the KiCad launcher plugin, as a GitHub Release -- what install.sh and
# install.ps1 download.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out openparts-kicad-plugin
        uses: actions/checkout@v4
        with:
          path: openparts-kicad-plugin

      - name: Check out openparts (path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openparts
          path: openparts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openparts-kicad-plugin

      - name: Install eframe Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: cargo build --release
        working-directory: openparts-kicad-plugin
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp openparts-kicad-plugin/target/release/openparts-kicad-plugin dist/
          cp openparts-kicad-plugin/kicad-integration/openparts_launcher.py dist/
          tar -czf openparts-kicad-plugin-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: openparts-kicad-plugin-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out openparts-kicad-plugin
        uses: actions/checkout@v4
        with:
          path: openparts-kicad-plugin

      - name: Check out openparts (path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openparts
          path: openparts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openparts-kicad-plugin

      - name: cargo build --release
        working-directory: openparts-kicad-plugin
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item openparts-kicad-plugin\target\release\openparts-kicad-plugin.exe dist\
          Copy-Item openparts-kicad-plugin\kicad-integration\openparts_launcher.py dist\
          Compress-Archive -Path dist\* -DestinationPath openparts-kicad-plugin-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: openparts-kicad-plugin-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            artifacts/openparts-kicad-plugin-linux-x86_64.tar.gz \
            artifacts/openparts-kicad-plugin-windows-x86_64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$tag" \
            --generate-notes
